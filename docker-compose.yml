name: tenantpay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenantpay
      POSTGRES_USER: tenantpay
      POSTGRES_PASSWORD: tenantpay
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantpay -d tenantpay"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tenantpay
      SPRING_DATASOURCE_USERNAME: tenantpay
      SPRING_DATASOURCE_PASSWORD: tenantpay
      TENANTPAY_JWT_SECRET: ${TENANTPAY_JWT_SECRET:-local-compose-secret-change-me-0123456789abcdef}
      TENANTPAY_ASAAS_WEBHOOK_TOKEN: ${TENANTPAY_ASAAS_WEBHOOK_TOKEN:-dev-webhook-token}
      TENANTPAY_DEV_TOOLS_ENABLED: ${TENANTPAY_DEV_TOOLS_ENABLED:-true}
      TENANTPAY_CORS_ALLOWED_ORIGINS: http://localhost:15173,http://localhost:5173
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api-sandbox.asaas.com/v3}
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "15173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  pgdata:
