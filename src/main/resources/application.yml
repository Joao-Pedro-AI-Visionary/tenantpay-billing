spring:
  application:
    name: tenantpay-billing
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/tenantpay}
    username: ${SPRING_DATASOURCE_USERNAME:tenantpay}
    password: ${SPRING_DATASOURCE_PASSWORD:tenantpay}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

tenantpay:
  jwt:
    # Development only default, rejected at startup unless dev tools are enabled (see DefaultSecretsGuard).
    # Production must set TENANTPAY_JWT_SECRET (at least 32 bytes).
    secret: ${TENANTPAY_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl: ${TENANTPAY_JWT_TTL:PT1H}
  asaas:
    base-url: ${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
    api-key: ${ASAAS_API_KEY:}
    # Development only default, rejected at startup unless dev tools are enabled (see DefaultSecretsGuard).
    webhook-token: ${TENANTPAY_ASAAS_WEBHOOK_TOKEN:dev-webhook-token}
  webhooks:
    poll-interval: ${TENANTPAY_WEBHOOKS_POLL_INTERVAL:PT0.5S}
    max-attempts: ${TENANTPAY_WEBHOOKS_MAX_ATTEMPTS:5}
    base-backoff: ${TENANTPAY_WEBHOOKS_BASE_BACKOFF:PT2S}
    max-backoff: ${TENANTPAY_WEBHOOKS_MAX_BACKOFF:PT5M}
    batch-size: 20
    processing-lease: PT5M
  dev-tools:
    enabled: ${TENANTPAY_DEV_TOOLS_ENABLED:false}
  cors:
    allowed-origins: ${TENANTPAY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:15173}
  scheduling:
    enabled: ${TENANTPAY_SCHEDULING_ENABLED:true}
