name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, unit, integration, ArchUnit)
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify (Testcontainers PostgreSQL)
        run: ./mvnw -B verify
      - name: Upload JaCoCo report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  frontend:
    name: Frontend (type check and build)
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E (docker compose + Playwright)
    # Runner do WSL: no host "box" o container da API sai com código 1 no
    # boot; o mesmo stack sobe saudável no WSL.
    runs-on: [self-hosted, linux, wsl]
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Start stack
        run: docker compose -p tenantpay up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run e2e
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:15173
          E2E_API_URL: http://localhost:18080
          E2E_WEBHOOK_TOKEN: dev-webhook-token
        run: npx playwright test
      - name: Compose logs
        if: failure()
        run: docker compose -p tenantpay logs --no-color | tee compose.log
      - name: Upload e2e artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
            docs/screenshots
            compose.log
          if-no-files-found: ignore
      - name: Stop stack
        if: always()
        run: docker compose -p tenantpay down -v
